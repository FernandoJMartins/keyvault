services:
  keyvault:
    build: .
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - PORT=4000
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    volumes:
      - keyvault_data:/data
    restart: unless-stopped

volumes:
  keyvault_data:
