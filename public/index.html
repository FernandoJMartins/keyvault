<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeyVault</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#4f5bfd" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="login-view" class="center-screen">
    <form id="login-form" class="card auth-card">
      <h1>KeyVault</h1>
      <p class="muted">Cofre de credenciais</p>
      <label>E-mail
        <input type="email" id="login-email" required autocomplete="username" />
      </label>
      <label>Senha
        <input type="password" id="login-password" required autocomplete="current-password" />
      </label>
      <p id="login-error" class="error hidden"></p>
      <button type="submit">Entrar</button>
    </form>
  </div>

  <div id="app-view" class="hidden">
    <header class="topbar">
      <h1>KeyVault</h1>
      <input type="search" id="search-input" placeholder="Buscar por nome ou e-mail..." />
      <select id="status-filter"></select>
      <div class="spacer"></div>
      <button id="add-btn" class="primary">+ Nova credencial</button>
      <button id="logout-btn" class="ghost">Sair</button>
    </header>

    <main id="grid" class="grid"></main>
    <p id="empty-state" class="muted center hidden">Nenhuma credencial cadastrada ainda.</p>
  </div>

  <div id="form-overlay" class="overlay hidden">
    <form id="cred-form" class="card modal">
      <h2 id="form-title">Nova credencial</h2>
      <label>Tipo
        <select id="cred-type"></select>
      </label>
      <label>Nome / apelido
        <input type="text" id="cred-name" required placeholder="ex: Conta Ads Cliente X" />
      </label>
      <label>Status
        <select id="cred-status"></select>
      </label>
      <div id="dynamic-fields"></div>
      <p id="form-error" class="error hidden"></p>
      <div class="modal-actions">
        <button type="button" class="ghost" id="cancel-form-btn">Cancelar</button>
        <button type="submit" class="primary">Salvar</button>
      </div>
    </form>
  </div>

  <div id="detail-overlay" class="overlay hidden">
    <div class="card modal">
      <div class="modal-header">
        <h2 id="detail-title"></h2>
        <button type="button" class="icon-btn" id="close-detail-btn">&times;</button>
      </div>
      <div id="detail-body"></div>
      <div class="modal-actions">
        <button type="button" class="ghost" id="edit-from-detail-btn">Editar</button>
        <button type="button" class="danger" id="delete-btn">Excluir</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
